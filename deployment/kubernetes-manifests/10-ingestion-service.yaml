---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: {{OPENSHIFT_NAMESPACE}}
  labels:
    app: ingestion-service
    component: ingestion
    tier: microservices
spec:
  selector:
    app: ingestion-service
  ports:
    - name: grpc
      port: 5000
      targetPort: 5000
      protocol: TCP
      appProtocol: grpc
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: {{OPENSHIFT_NAMESPACE}}
  labels:
    app: ingestion-service
    component: ingestion
    tier: microservices
spec:
  # IMPORTANT: Keep replicas=1 to avoid session management issues
  # Sessions are stored in-memory; multiple replicas would cause session loss
  # because StartCollection and StopCollection could hit different pods.
  # Future: Use Redis for shared session state to enable horizontal scaling.
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
        component: ingestion
        tier: microservices
    spec:
      serviceAccountName: flowfish
      containers:
        - name: ingestion-service
          image: {{HARBOR_REGISTRY}}/{{HARBOR_PROJECT}}/flowfish-ingestion-service:{{IMAGE_TAG}}
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 5000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "ingestion-service"
            - name: GRPC_PORT
              value: "5000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: flowfish-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowfish-secrets
                  key: rabbitmq-password
            # Cluster Manager gRPC - for Pod/Service discovery
            - name: CLUSTER_MANAGER_URL
              value: "cluster-manager:5001"
            # kubectl-gadget configuration
            - name: GADGET_PROTOCOL
              value: "kubectl"
            - name: GADGET_NAMESPACE
              value: "{{OPENSHIFT_NAMESPACE}}"
            - name: GADGET_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: GADGET_REGISTRY
            - name: GADGET_IMAGE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: GADGET_IMAGE_VERSION
            - name: GADGET_IMAGE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: GADGET_IMAGE_PREFIX
            # Cold-start tolerance for the IG DaemonSet warm-up race.
            #
            # The first analysis run after an IG (re)install pays the
            # OCI image-pull + gRPC dial latency on every gadget. WAIT
            # gives the bulk of gadgets time to come up; RETRY auto-
            # restarts any that lost the race so the operator never
            # sees a transient warning. The retry recreates both the
            # gadget subprocess and its collection task together — see
            # TraceManager._retry_failed_gadgets.
            #
            # Bump WAIT if your registry is far/slow (e.g. air-gapped
            # cluster pulling from a remote Harbor mirror). Bump RETRY
            # only if a single warm-path retry is still not enough,
            # which would point at a deeper IG/network issue.
            - name: GADGET_STARTUP_WAIT_SECONDS
              value: "8.0"
            - name: GADGET_STARTUP_RETRY_ATTEMPTS
              # Two retries (was 1) — covers the heavy-load path where the
              # first retry hits an IG pod that's still finishing its post-
              # SIGKILL restart, while the second retry catches the pod
              # once it's actually warm. Each attempt waits a progressively
              # longer pre-wait (see GADGET_RETRY_BACKOFF_MULTIPLIER).
              value: "2"
            - name: GADGET_RETRY_BACKOFF_MULTIPLIER
              # Multiplier applied to GADGET_RETRY_PRE_WAIT_SECONDS on each
              # attempt past the first: with 1.5x and 12s base the wait
              # progression is 12s → 18s → 27s, ... Set to 1.0 for legacy
              # constant backoff (each retry waits the same amount).
              value: "1.5"
            # Stagger interval between consecutive gadget launches and
            # extra wait before retries. Together these prevent the IG
            # DaemonSet from being flooded by an 11-gadget burst (which
            # in production triggered "lost samples / bad fd" errors,
            # IG SIGKILL exit 137, and trace_sni SIGABRT). 1.0s stagger
            # adds ~11s to a full 11-gadget session start; 12s retry
            # pre-wait covers IG container restart bootstrap.
            #
            # Stagger raised 0.5s → 1.0s after observing kprobe-heavy
            # gadgets (trace_tcp / trace_open / trace_capabilities /
            # trace_bind) racing for kernel kprobe attach slots when
            # spawned 0.5s apart on a busy cluster. Tune up if your
            # cluster has even heavier per-node traffic.
            - name: GADGET_STARTUP_STAGGER_SECONDS
              value: "1.0"
            - name: GADGET_RETRY_PRE_WAIT_SECONDS
              value: "12.0"
            # Encryption key for remote cluster credentials
            - name: FLOWFISH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flowfish-secrets
                  key: FLOWFISH_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 500m
              memory: 2Gi  # Increased for multi-cluster analysis with large service caches
            limits:
              cpu: "4"     # Increased for parallel event processing
              memory: 8Gi  # Increased significantly to prevent OOM during heavy multi-cluster analysis
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; channel = grpc.insecure_channel('localhost:5000'); channel.close()"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; channel = grpc.insecure_channel('localhost:5000'); channel.close()"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      securityContext:
        runAsNonRoot: false

